<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Self-Bondage Task</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070607">
<script>
(function () {
  var d = "mobile";
  try {
    var f = localStorage.getItem("sb_device");
    if (f === "mobile" || f === "desktop") d = f;
    else if (typeof matchMedia === "function") d = (matchMedia("(pointer: coarse)").matches || matchMedia("(hover: none)").matches) ? "mobile" : "desktop";
  } catch (e) {
    try { if (typeof matchMedia === "function") d = (matchMedia("(pointer: coarse)").matches || matchMedia("(hover: none)").matches) ? "mobile" : "desktop"; } catch (e2) {}
  }
  document.documentElement.dataset.device = d;
})();
</script>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #070607;
    --glass: rgba(16, 14, 15, 0.86);
    --glass-border: rgba(190, 190, 200, 0.18);
    --text: #f1f1f5;
    --muted: #a8a3a6;
    --accent: #b3122b;
    --accent-2: #5c0a17;
    --ok: #3ecf8e;
    --warn: #ffb020;
    --danger: #ff4d5e;
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    background: var(--bg);
    overflow-x: hidden;
  }
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(1200px 700px at 15% -10%, rgba(179,18,43,.38), transparent 60%),
      radial-gradient(1000px 700px at 100% 110%, rgba(92,10,23,.42), transparent 60%),
      var(--bg);
    filter: saturate(1.05);
  }
  .veil { position: fixed; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.7)); backdrop-filter: blur(6px); }

  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 18px 24px; max-width: 960px; margin: 0 auto;
  }
  .brand { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: .85rem; color: var(--muted); }
  .brand b { color: var(--text); }
  .lang { display: flex; gap: 4px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 999px; padding: 3px; }
  .lang button { background: transparent; border: 0; color: var(--muted); padding: 5px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .8rem; }
  .lang button.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }

  .stepper { display: flex; gap: 8px; max-width: 960px; margin: 0 auto; padding: 0 24px; }
  .stepper i { flex: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; position: relative; }
  .stepper i::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transform: scaleX(0); transform-origin: left; transition: transform .5s ease; }
  .stepper i.done::after { transform: scaleX(1); }

  main { max-width: 960px; margin: 0 auto; padding: 24px 24px 120px; }
  .stage { display: none; animation: rise .45s ease both; }
  .stage.active { display: block; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 28px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
  }
  h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); margin: 0 0 8px; letter-spacing: -.02em; }
  h2 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: -.01em; }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin: 24px 0 10px; font-weight: 600; }
  p { line-height: 1.6; color: #d6d6e0; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }

  button.btn {
    border: 0; cursor: pointer; font-weight: 600; font-size: 1rem;
    padding: 13px 24px; border-radius: 12px; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    transition: transform .15s ease, box-shadow .2s ease, opacity .2s;
    box-shadow: 0 8px 24px rgba(179,18,43,.28);
  }
  button.btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(179,18,43,.4); }
  button.btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
  button.btn.ghost { background: rgba(255,255,255,.07); box-shadow: none; border: 1px solid var(--glass-border); }
  button.btn.ghost:hover:not(:disabled) { background: rgba(255,255,255,.12); box-shadow: none; }

  input[type="text"] {
    width: 100%; max-width: 380px; padding: 13px 16px; font-size: 1rem; color: var(--text);
    background: rgba(0,0,0,.35); border: 1px solid var(--glass-border); border-radius: 12px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(179,18,43,.25); }

  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    user-select: none; cursor: pointer; padding: 10px 16px; border-radius: 999px;
    background: rgba(255,255,255,.06); border: 1px solid var(--glass-border);
    font-size: .95rem; transition: all .18s ease; display: inline-flex; align-items: center; gap: 8px;
  }
  .chip:hover { background: rgba(255,255,255,.12); }
  .chip.on { background: linear-gradient(135deg, rgba(179,18,43,.55), rgba(92,10,23,.55)); border-color: rgba(255,255,255,.3); }
  .chip .x { opacity: .7; font-weight: 700; }
  .chip .x:hover { opacity: 1; }

  .seg { display: inline-flex; background: rgba(0,0,0,.3); border: 1px solid var(--glass-border); border-radius: 12px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 9px 18px; border-radius: 9px; cursor: pointer; font-weight: 600; }
  .seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }

  .slider-wrap { display: flex; align-items: center; gap: 16px; }
  input[type="range"] { flex: 1; max-width: 420px; accent-color: var(--accent); height: 6px; }
  .big-num { font-size: 1.6rem; font-weight: 700; min-width: 110px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } .card { padding: 20px; } }

  .pos-card {
    display: flex; gap: 18px; align-items: center; padding: 18px; border-radius: 14px;
    background: rgba(0,0,0,.28); border: 1px solid var(--glass-border);
  }
  .pos-icon { font-size: 2.2rem; width: 64px; height: 64px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg, rgba(179,18,43,.4), rgba(92,10,23,.4)); flex: none; }
  .pos-name { font-weight: 700; font-size: 1.15rem; }
  .pos-desc { color: var(--muted); font-size: .92rem; margin-top: 2px; }

  .check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: rgba(0,0,0,.25); border: 1px solid var(--glass-border); margin-bottom: 10px; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--ok); flex: none; }
  .check span { line-height: 1.5; }

  .brief-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .brief-list li { padding: 14px 16px; border-radius: 12px; background: rgba(0,0,0,.28); border: 1px solid var(--glass-border); display: flex; gap: 12px; line-height: 1.5; }
  .brief-list .ic { flex: none; font-size: 1.2rem; }

  /* Session */
  .session { text-align: center; }
  .ring { position: relative; width: min(320px, 78vw); aspect-ratio: 1; margin: 8px auto 20px; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255,255,255,.08); }
  .ring .prog { stroke: url(#grad); stroke-linecap: round; transition: stroke-dashoffset .3s linear; filter: drop-shadow(0 0 8px rgba(179,18,43,.6)); }
  .ring .center { position: absolute; inset: 0; display: grid; place-content: center; }
  .time { font-size: clamp(2.4rem, 8vw, 3.4rem); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .time-sub { color: var(--muted); font-size: .85rem; text-transform: uppercase; letter-spacing: .1em; }
  .phrase { min-height: 56px; font-size: 1.1rem; font-style: italic; color: #e6d9ee; transition: opacity .6s; max-width: 560px; margin: 0 auto; }
  .checkin {
    display: none; margin: 18px auto 0; max-width: 520px; padding: 14px 18px; border-radius: 14px;
    background: rgba(255,176,32,.12); border: 1px solid rgba(255,176,32,.5);
    animation: pulse 1.6s infinite;
  }
  .checkin.show { display: flex; gap: 14px; align-items: center; justify-content: space-between; text-align: left; }
  .checkin.show { position: fixed; top: 10px; left: 10px; right: 10px; margin: 0 auto; z-index: 70; background: #2a1d10; flex-wrap: wrap; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,176,32,.35); } 50% { box-shadow: 0 0 0 10px rgba(255,176,32,0); } }

  /* Puzzle */
  .arrows { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; min-height: 64px; margin: 14px 0; }
  .arr {
    width: 52px; height: 52px; display: grid; place-items: center; border-radius: 12px; font-size: 1.6rem;
    background: rgba(255,255,255,.07); border: 1px solid var(--glass-border); transition: all .2s;
  }
  .arr.ok { background: rgba(62,207,142,.2); border-color: var(--ok); color: var(--ok); transform: scale(.95); }
  .arr.now { border-color: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,.15); }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
  .dpad { display: grid; grid-template-columns: repeat(3, 68px); grid-template-rows: repeat(2, 68px); gap: 8px; justify-content: center; margin: 18px 0 6px; }
  .dpad button { font-size: 1.5rem; border-radius: 14px; border: 1px solid var(--glass-border); background: rgba(255,255,255,.08); color: #fff; cursor: pointer; transition: background .15s, transform .1s; }
  .dpad button:hover { background: rgba(255,255,255,.16); }
  .dpad button:active { transform: scale(.93); }
  .dpad .u { grid-column: 2; grid-row: 1; }
  .dpad .l { grid-column: 1; grid-row: 2; }
  .dpad .d { grid-column: 2; grid-row: 2; }
  .dpad .r { grid-column: 3; grid-row: 2; }
  .stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .stat { padding: 12px 20px; border-radius: 12px; background: rgba(0,0,0,.28); border: 1px solid var(--glass-border); min-width: 120px; }
  .stat b { display: block; font-size: 1.4rem; }
  .stat small { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: .7rem; }

  .release-title { color: var(--ok); }

  /* Emergency */
  #sos {
    position: fixed; right: 18px; bottom: 18px; z-index: 50; display: none; overflow: hidden;
    background: var(--danger); color: #fff; border: 0; border-radius: 999px; padding: 20px 32px;
    font-weight: 700; font-size: 1.05rem; cursor: pointer; box-shadow: 0 10px 30px rgba(255,77,94,.45);
  }
  #sos::after { content: ""; position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: #fff; }
  #sos.dwell::after { width: 100%; transition: width 1.5s linear; }

  /* Click task */
  .field {
    position: relative; width: 100%; height: min(46vh, 380px); border-radius: 16px;
    background: rgba(0,0,0,.35); border: 1px dashed rgba(255,255,255,.18);
    overflow: hidden; touch-action: none; margin-bottom: 14px; cursor: crosshair;
  }
  .target {
    position: absolute; border-radius: 50%; cursor: pointer; touch-action: none;
    background: radial-gradient(circle at 35% 30%, #ff9aa8, #c4112e 55%, #3d050e);
    box-shadow: 0 0 24px rgba(179,18,43,.7);
  }
  .target::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; }
  .target.pop { animation: pop .25s; }
  @keyframes pop { 50% { transform: scale(1.25); } }
  #sos.show { display: block; }
  #sos:hover { filter: brightness(1.1); }
  /* Suggestions / browse */
  .pos-note { color: var(--warn); font-size: .85rem; margin-top: 6px; line-height: 1.4; }
  .sugg, .browse-list { display: grid; gap: 8px; }
  .sg {
    display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; cursor: pointer;
    background: rgba(0,0,0,.25); border: 1px solid var(--glass-border); transition: all .15s ease;
  }
  .sg:hover { background: rgba(255,255,255,.08); }
  .sg.on { border-color: rgba(255,255,255,.55); background: linear-gradient(135deg, rgba(179,18,43,.35), rgba(92,10,23,.35)); }
  .sg.dim { opacity: .55; }
  .sg { user-select: none; -webkit-user-select: none; }
  .sg-tx { flex: 1; }
  .sg-swap {
    flex: none; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--glass-border);
    background: rgba(255,255,255,.07); color: var(--text); cursor: pointer; font-size: 1.1rem;
    transition: transform .25s ease, background .15s;
  }
  .sg-swap:hover { background: rgba(255,255,255,.16); transform: rotate(180deg); }
  .sg-ic { font-size: 1.5rem; width: 40px; height: 40px; display: grid; place-items: center; flex: none; }
  .sg-n { font-weight: 600; }
  .sg-m { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .browse-list { max-height: 360px; overflow: auto; padding-right: 4px; margin-top: 12px; }
  /* Face control */
  #cam-dock {
    position: fixed; left: 14px; bottom: 14px; z-index: 45; width: 140px; border-radius: 14px; overflow: hidden;
    background: #000; border: 2px solid var(--danger); box-shadow: 0 8px 24px rgba(0,0,0,.5); transition: opacity .2s;
  }
  #cam-dock.ok { border-color: var(--ok); }
  #cam-dock.off { opacity: 0; pointer-events: none; }
  #cam-dock.inline { position: relative; left: auto; bottom: auto; width: min(320px, 100%); margin: 12px 0; }
  #cam-video { display: block; width: 100%; transform: scaleX(-1); background: #111; min-height: 60px; }
  #cam-glyph { position: absolute; top: 6px; right: 8px; font-size: 1.6rem; text-shadow: 0 0 8px #000; }
  #cam-state { position: absolute; left: 0; right: 0; bottom: 0; padding: 3px 8px; font-size: .72rem; background: rgba(0,0,0,.6); color: var(--warn); }
  #cam-state:empty { display: none; }
  #face-warn {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 60; max-width: 92vw;
    background: rgba(255,77,94,.95); color: #fff; padding: 12px 18px; border-radius: 12px; font-weight: 600; text-align: center;
  }
  .hp {
    position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; pointer-events: none; z-index: 3;
    border: 3px solid #fff; --p: 0;
    background: conic-gradient(var(--ok) calc(var(--p) * 360deg), rgba(255,255,255,.18) 0);
    box-shadow: 0 0 10px rgba(0,0,0,.6);
  }
  /* Trace task */
  #trace-canvas {
    display: block; width: 100%; height: min(54vh, 460px); border-radius: 16px; margin-bottom: 0;
    background: rgba(0,0,0,.35); border: 1px dashed rgba(255,255,255,.18); touch-action: none; cursor: crosshair;
  }
  body.in-session header, body.in-session .stepper { display: none; }
  body.in-session main { padding-top: 12px; }
  @media (max-height: 700px) { #st-session.compact .ring { width: 70px; } #st-session.compact .stat { padding: 4px 12px; } }
  #st-session.compact .card { padding: 14px; }
  #st-session.compact .ring { width: 92px; margin: 0 auto 8px; }
  #st-session.compact .time { font-size: 1.35rem; }
  #st-session.compact .time-sub, #st-session.compact .phrase { display: none; }
  #st-session.compact .sub { font-size: .82rem; margin: 0 0 8px; }
  #st-session.compact .stats { margin: 0 0 8px !important; gap: 8px; }
  #st-session.compact .stat { padding: 6px 14px; min-width: 96px; }
  #st-session.compact .stat b { font-size: 1.1rem; }
  .hidden { display: none !important; }
  .add-row { display: flex; gap: 6px; margin: 8px 0; }
  .add-row input { flex: 1; min-width: 0; }
  #custom-pre { width: 100%; margin: 4px 0; padding: 8px; border-radius: 8px; background: rgba(0,0,0,.35); color: inherit; border: 1px solid rgba(255,255,255,.2); }
  .clist { list-style: none; margin: 8px 0; padding: 0; }
  .clist li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; margin: 4px 0; border-radius: 8px; background: rgba(0,0,0,.25); border: 1px solid rgba(255,255,255,.12); font-size: .92rem; }
  .clist li span { flex: 1; overflow-wrap: anywhere; }
  .clist li button { background: none; border: 0; color: #ff6b7d; font-size: 1.1rem; cursor: pointer; padding: 2px 8px; }
  .verdict { margin: 16px 0; padding: 16px; border-radius: 10px; border: 1px solid rgba(224,33,63,.55); background: rgba(179,18,43,.12); text-align: center; }
  .verdict-out { margin-top: 12px; min-height: 1px; }
  .verdict-out .v-title { font-size: 1.35rem; font-weight: 800; letter-spacing: .04em; margin-bottom: 6px; }
  .verdict-out .v-line { margin: 4px 0; font-size: .98rem; }
  .verdict-out .v-wait { font-size: 1.1rem; letter-spacing: .2em; animation: vpulse 1s infinite; }
  .verdict-out.allowed .v-title { color: #66e0a3; }
  .verdict-out.cond .v-title { color: #ffd479; }
  .verdict-out.denied .v-title { color: #ff6b7d; }
  @keyframes vpulse { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  html[data-device="desktop"] .verdict { border-radius: 2px; border-color: var(--edge); background: rgba(0,0,0,.4); }
  .tip-card { display: block; }
  .tip-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .tip-label { font-size: .7rem; letter-spacing: .18em; text-transform: uppercase; color: #e08a97; font-weight: 700; }
  .tip-meta { color: var(--muted); font-size: .82rem; margin-top: 2px; }
  .tip-lead { margin: 0 0 8px; font-style: italic; color: #f1e6e8; }
  .tip-p { margin: 0 0 8px; font-size: .93rem; line-height: 1.55; }
  .tip-p b { color: #f0b3bd; }
  .tip-need { margin: 8px 0 0; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--glass-border); padding-top: 8px; }
  html[data-device="desktop"] .tip-label, html[data-device="desktop"] .tip-p b { color: #c9a24a; }
  html[data-device="desktop"] .tip-lead { color: var(--lit); }
  /* Guide overlay */
  #guide { position: fixed; inset: 0; z-index: 80; display: none; background: rgba(8,4,16,.88); overflow-y: auto; padding: 18px 14px 40px; }
  #guide.show { display: block; }
  #guide .gcard { max-width: 760px; margin: 0 auto; background: #1b1230; border: 1px solid var(--glass-border); border-radius: 18px; padding: 22px 20px; text-align: left; }
  #guide h2 { margin-top: 0; }
  #guide h3 { margin: 18px 0 6px; font-size: 1rem; }
  #guide p, #guide li { line-height: 1.55; font-size: .93rem; }
  #guide ul { padding-left: 20px; margin: 6px 0; }
  #guide a { color: #9ad0ff; word-break: break-all; }
  #guide .gnote { color: var(--warn); font-size: .85rem; }
  .linkbtn { background: none; border: 0; color: #9ad0ff; text-decoration: underline; cursor: pointer; font: inherit; padding: 6px 0; }
  .lockbox { margin-top: 12px; padding: 14px 16px; border-radius: 12px; background: rgba(62,207,142,.1); border: 1px solid rgba(62,207,142,.5); text-align: center; }
  .lockbox b { font-size: 1.6rem; letter-spacing: .15em; display: block; margin-top: 4px; }
  body.alarm { animation: alarmflash .6s infinite; }
  @keyframes alarmflash { 0%,100% { box-shadow: inset 0 0 0 0 rgba(255,77,94,0); } 50% { box-shadow: inset 0 0 0 14px rgba(255,77,94,.7); } }
  .checkin .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.danger { background: var(--danger); color: #fff; }
  .small-note { font-size: .82rem; color: var(--muted); margin: 6px 0 0; }

  /* ===== BDSM-tema: svart läder, sömmar, nitar, krom, blodrött ===== */
  body {
    background:
      radial-gradient(900px 520px at 50% -8%, rgba(179,18,43,.35), transparent 65%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.028) 0 2px, transparent 2px 5px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,.35) 0 2px, transparent 2px 5px),
      #070607;
  }
  .bg { background: none; }
  .ver { display: inline-block; margin-left: 6px; padding: 2px 9px; border-radius: 4px; font-size: .68rem; font-weight: 800; letter-spacing: .12em; color: #111; background: linear-gradient(180deg, #f1f1f6, #8b8b95 55%, #d6d6de); }
  header { position: relative; padding-bottom: 22px; }
  header::after {   /* kedja */
    content: ""; position: absolute; left: 24px; right: 24px; bottom: 6px; height: 8px;
    background: radial-gradient(ellipse 7px 4px at 7px 4px, transparent 2.6px, #b9b9c4 3px, #6d6d77 4px, transparent 4.5px) 0 0 / 14px 8px repeat-x;
    opacity: .75;
  }

  .torch .flame2 { transform-box: fill-box; transform-origin: 50% 100%; animation: flame .7s infinite ease-in-out reverse; }

  @media (max-width: 1180px) { .torch { display: none !important; } }

              <button data-v="on" data-i18n="blindOn"></button>

  <!-- 6 Session -->
  <section class="stage" id="st-session">
    <div class="card session">
      <div class="ring">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#e0213f"/>
              <stop offset="100%" stop-color="#6a0b1a"/>
            </linearGradient>
          </defs>
          <circle class="track" cx="100" cy="100" r="90" fill="none" stroke-width="8"/>
          <circle class="prog" id="ring-prog" cx="100" cy="100" r="90" fill="none" stroke-width="8" stroke-dasharray="565.48" stroke-dashoffset="0"/>
        </svg>

const TRACE_N = 240;
const SHAPES = {
  wave: () => Array.from({ length: 160 }, (_, i) => { const u = i / 159; return [0.06 + 0.88 * u, 0.5 + 0.28 * Math.sin(u * Math.PI * 5)]; }),
  snake: () => {

      const y = 0.12 + r * (0.76 / (rows - 1)), a = r % 2 === 0 ? 0.1 : 0.9, b = r % 2 === 0 ? 0.9 : 0.1;

    const u = i / 219, a = u * 1.8 * 2 * Math.PI, r = 0.44 - 0.34 * u;

  heart: () => Array.from({ length: 220 }, (_, i) => {
    const t = Math.PI + (i / 219) * 2 * Math.PI * 0.94;

    const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

  eight: () => Array.from({ length: 220 }, (_, i) => {

  }),
  star: () => {
    const v = (k) => { const a = -Math.PI / 2 + k * 2 * Math.PI / 5; return [0.5 + 0.44 * Math.cos(a), 0.54 + 0.44 * Math.sin(a)]; };
    const a = v(3), b = v(0);
    return [v(0), v(2), v(4), v(1), a, [a[0] + (b[0] - a[0]) * 0.85, a[1] + (b[1] - a[1]) * 0.85]];
  },
  zig: () => [[0.12, 0.15], [0.88, 0.15], [0.12, 0.85], [0.88, 0.85]]

// Se till att rit- och klickytan slutar ovanför Avbryt-knappen så att den aldrig hamnar ovanpå
function fitAboveSos(el, minH, maxH) {
  const sos = $("sos").getBoundingClientRect();
  if (!sos.height) return;
  const top = el.getBoundingClientRect().top + window.scrollY;

// Gör om en linje till n jämnt fördelade punkter längs sin längd

  let j = 1;

    const d = (k / (n - 1)) * total;
    while (j < cum.length - 1 && cum[j] < d) j++;
    const seg = cum[j] - cum[j - 1] || 1, f = Math.min(1, Math.max(0, (d - cum[j - 1]) / seg));
    out.push([pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * f, pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * f]);
  }

}
const TR = { name: "", last: "", norm: [], pts: [], idx: 0, maxIdx: 0, down: false, px: 0, py: 0, on: true, offSince: 0, flashUntil: 0, doneUntil: 0, slips: 0, w: 300, h: 300, dpr: 1 };

function traceNew() {
  const names = Object.keys(SHAPES).filter((n) => n !== TR.last);
  TR.name = pick(names); TR.last = TR.name;
  TR.norm = resample(SHAPES[TR.name](), TRACE_N);

}

  if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  // Formen fyller ytan men sträcks högst 40 % åt något håll så att den inte blir förvriden
  const base = Math.min(w, h) * 0.9, sw = Math.min(w * 0.9, base * 1.4), sh = Math.min(h * 0.9, base * 1.4);

const FACE = {

    const gum = (c) => navigator.mediaDevices.getUserMedia(c);
    try {
      FACE.stream = await gum({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    } catch (e1) {
      if (e1 && (e1.name === "NotAllowedError" || e1.name === "SecurityError")) throw e1;
      FACE.stream = await gum({ video: true, audio: false });   // enklare reservläge
    }
    const v = FACE.video();
    v.srcObject = FACE.stream;
    await v.play();
  } catch (e) {
    FACE.loading = false;
    FACE.err = camErrKey(e); FACE.errDetail = (e && e.name) || "";
    FACE.stop(true); updateFaceUI(); return;
  }
  try {
    if (!FACE.landmarker) {
      const mod = await import(FACE.MP + "/vision_bundle.mjs");
      const fileset = await mod.FilesetResolver.forVisionTasks(FACE.MP + "/wasm");
      const make = (delegate) => mod.FaceLandmarker.createFromOptions(fileset, {
        baseOptions: { modelAssetPath: FACE.MODEL, delegate }, runningMode: "VIDEO", numFaces: 1
      });
      FACE.make = make;
      try { FACE.landmarker = await make("GPU"); FACE.delegate = "GPU"; }
      catch (e) { FACE.landmarker = await make("CPU"); FACE.delegate = "CPU"; }
    }
  } catch (e) {
    FACE.loading = false; FACE.err = "errmodel"; FACE.stop(true); updateFaceUI(); return;
  }
  FACE.loading = false; FACE.running = true; FACE.lastVT = -1; FACE.frames = 0; FACE.hits = 0; FACE.lastErr = "";
  clearInterval(FACE.diagId); FACE.diagId = setInterval(updateDiag, 500);
  FACE.loop();
  updateFaceUI();
};

FACE.stop = function (keepErr) {
  FACE.running = false; cancelAnimationFrame(FACE.raf); clearInterval(FACE.diagId);
  if (FACE.stream) { FACE.stream.getTracks().forEach(tr => tr.stop()); FACE.stream = null; }
  try { FACE.video().srcObject = null; } catch (e) {}
  FACE.neutral = null; FACE.calibrating = null; FACE.calFail = false; FACE.present = false;
  FACE.resetGesture();
  if (!keepErr) { FACE.err = null; FACE.errDetail = ""; }
  clearTimeout(S.warnId); $("face-warn").classList.add("hidden"); $("hp").classList.add("hidden");
  S.dwellAt = 0;
};

function faceStatusKey() {
  if (FACE.err) return "faceS_" + FACE.err;
  if (FACE.loading) return "faceS_loading";
  if (!FACE.running) return "faceS_idle";
  if (FACE.calibrating) return "faceS_cal";
  if (!FACE.neutral) return FACE.calFail ? "faceS_nofacecal" : "faceS_needcal";
  return FACE.present ? "faceS_ready" : "faceS_noface";
}
function updateFaceUI() {
  const on = S.face, ready = FACE.ready();
  $("face-hint").textContent = t(on ? "faceHintOn" : "faceHintOff");
  $("face-opts").classList.toggle("hidden", !on);
  $("face-panel").classList.toggle("hidden", !on);
  $("face-status").textContent = t(faceStatusKey()) + (FACE.err && FACE.errDetail ? " (" + FACE.errDetail + ")" : "");
  $("btn-cam").textContent = t("camStart"); $("btn-cam").disabled = FACE.running || FACE.loading;
  $("btn-cal").textContent = t("calStart"); $("btn-cal").disabled = !FACE.running || !!FACE.calibrating;
  $("btn-start").disabled = on && !ready;
  const show = on && FACE.running && ["st-brief", "st-session", "st-puzzle"].includes(S.stage);
  const dock = $("cam-dock");
  dock.classList.toggle("off", !show);
  dock.classList.toggle("ok", FACE.present);
  $("cam-state").textContent = FACE.present ? "" : t("faceS_noface");
  $("checkin-nod").textContent = on && ready ? t("checkinNod") : "";
  $("puzzle-face").textContent = on && ready ? t("puzzleFace") : "";
}

const KEYOF = { up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight" };
function flashGlyph(txt, ms) {
  $("cam-glyph").textContent = txt;
  if (ms) setTimeout(() => { if ($("cam-glyph").textContent === txt) $("cam-glyph").textContent = ""; }, ms);
}
FACE.h.cls = (c) => flashGlyph(SYMBOL[KEYOF[c]] || "", 0);
FACE.h.dir = (d) => { if (S.stage === "st-puzzle") pressKey(KEYOF[d]); };
FACE.h.nod = () => {
  flashGlyph("👍", 900);
  if (S.stage === "st-session" && $("checkin").classList.contains("show")) confirmCheckin();
};
FACE.h.tilt = () => { if (["st-session", "st-puzzle"].includes(S.stage)) abort(); };
FACE.h.found = () => {
  clearTimeout(S.warnId); $("face-warn").classList.add("hidden"); updateFaceUI();
};
FACE.h.lost = () => {
  $("hp").classList.add("hidden"); S.dwellAt = 0; updateFaceUI();
  clearTimeout(S.warnId);
  S.warnId = setTimeout(() => {
    if (S.face && !FACE.present && ["st-session", "st-puzzle"].includes(S.stage)) {
      $("face-warn").textContent = t("faceWarn");
      $("face-warn").classList.remove("hidden");
    }
  }, 2000);
};
FACE.h.point = (x, y, tm) => {
  const hp = $("hp");
  if (!S.face || S.stage !== "st-session" || S.mode !== "click") { hp.classList.add("hidden"); S.dwellAt = 0; return; }
  const fr = $("field").getBoundingClientRect(), tr = $("target").getBoundingClientRect();
  const cx = x * fr.width, cy = y * fr.height;
  hp.classList.remove("hidden");
  hp.style.left = cx + "px"; hp.style.top = cy + "px";
  const tx = tr.left - fr.left + tr.width / 2, ty = tr.top - fr.top + tr.height / 2;
  const inside = Math.hypot(cx - tx, cy - ty) <= (tr.width / 2) * 1.3;
  if (inside) {
    if (!S.dwellAt) S.dwellAt = tm;
    const pr = Math.min(1, (tm - S.dwellAt) / FACE.DWELL_MS);
    hp.style.setProperty("--p", pr);
    if (pr >= 1) { S.dwellAt = 0; hp.style.setProperty("--p", 0); onHit(); }
  } else { S.dwellAt = 0; hp.style.setProperty("--p", 0); }
};

/* ============ Håll skärmen vaken + offline ============ */
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on) { if (!wakeLock && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); }
    else if (wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch (e) { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && ["st-session", "st-puzzle"].includes(S.stage)) { wakeLock = null; keepAwake(true); }
});
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}

/* ============ Events ============ */
function updateDurationOut() { $("duration-out").textContent = S.duration + " " + t("minutes"); }

function bindSeg(id, onPick) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    [...$(id).children].forEach(c => c.classList.toggle("on", c === b));
    onPick(b.dataset.v);
  });
}

document.addEventListener("DOMContentLoaded", () => {
  const savedLang = load("lang");
  if (savedLang === "sv" || savedLang === "en") S.lang = savedLang;
  const savedName = load("name"); if (savedName) $("user-name").value = savedName;
  const savedGender = load("gender");
  if (savedGender) { S.gender = savedGender; [...$("gender-seg").children].forEach(c => c.classList.toggle("on", c.dataset.v === savedGender)); }

  $("lang-sv").onclick = () => { S.lang = "sv"; store("lang", "sv"); applyI18n(); };
  $("lang-en").onclick = () => { S.lang = "en"; store("lang", "en"); applyI18n(); };

  $("btn-yes").onclick = () => go("st-profile");
  $("btn-no").onclick = () => alert(S.lang === "sv" ? "Sessionen avslutad." : "Session ended.");

  const validateProfile = () => {
    S.name = $("user-name").value.trim();
    $("btn-profile-next").disabled = !(S.name && S.gender);
  };
  $("user-name").addEventListener("input", validateProfile);
  bindSeg("gender-seg", (v) => { S.gender = v; validateProfile(); });
  validateProfile();
  $("btn-profile-next").onclick = () => { store("name", S.name); store("gender", S.gender); go("st-items"); };

  $("btn-add-item").onclick = addCustom;
  $("item-input").addEventListener("keydown", (e) => { if (e.key === "Enter") addCustom(); });
  $("btn-items-next").onclick = () => { S.position = null; rollPosition(); go("st-setup"); };

  document.querySelectorAll("[data-back]").forEach(b => b.onclick = () => go(b.dataset.back));

  $("duration").addEventListener("input", (e) => { S.duration = +e.target.value; updateDurationOut(); });
  bindSeg("diff-seg", (v) => S.difficulty = v);
  bindSeg("checkin-seg", (v) => S.checkins = v === "on");
  bindSeg("face-seg", (v) => { S.face = v === "on"; if (!S.face) FACE.stop(); updateFaceUI(); });
  bindSeg("sens-seg", (v) => { FACE.sens = +v; });
  bindSeg("mode-seg", (v) => { S.mode = v; updateModeUI(); });
  bindSeg("hit-seg", (v) => S.hitSec = +v);
  bindSeg("size-seg", (v) => S.size = v);
  bindSeg("move-seg", (v) => S.move = v);
  bindSeg("tsec-seg", (v) => S.traceSec = +v);
  bindSeg("tw-seg", (v) => S.traceW = +v);
  $("btn-reroll").onclick = rollPosition;
  $("btn-sugg").onclick = () => { S.suggOpen = !S.suggOpen; renderBrowse(); };
  $("btn-browse").onclick = () => { S.browseOpen = !S.browseOpen; renderBrowse(); };
  bindSeg("level-seg", (v) => { S.level = +v; rollPosition(); });
  $("btn-setup-next").onclick = () => {
    if (S.lock && !S.lockCode) { $("lock-code").focus(); $("cap-note").textContent = t("lockNeed"); return; }
    renderSafety(); go("st-safety");
  };

  $("btn-safety-next").onclick = () => { renderBrief(); go("st-brief"); };
  $("btn-start").onclick = startSession;
  $("btn-cam").onclick = () => FACE.start();
  $("btn-cal").onclick = () => FACE.beginCalibration();
  $("btn-checkin").onclick = confirmCheckin;
  $("btn-numb").onclick = abort;
  $("btn-guide-open").onclick = openGuide;
  $("btn-guide-close").onclick = closeGuide;
  $("guide-body").addEventListener("click", (e) => { const b = e.target.closest("[data-dev]"); if (b) setDevice(b.dataset.dev); });
  S.device = document.documentElement.dataset.device || "mobile";
  if (S.device === "desktop") S.blind = false;
  document.querySelectorAll("[data-guide]").forEach(b => b.onclick = openGuide);
  bindSeg("ptype-seg", (v) => S.ptype = v);
  bindSeg("verdict-seg", (v) => S.verdict = v === "on");
  $("btn-verdict").onclick = showVerdict;
  bindSeg("custom-seg", (v) => setCustom(v === "on"));
  setCustom(customOn());
  $("custom-add").onclick = () => { addCond($("custom-input").value); $("custom-input").value = ""; $("custom-input").focus(); };
  $("custom-input").addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); $("custom-add").onclick(); } });
  $("custom-pre").addEventListener("change", (e) => { addCond(e.target.value); renderCustom(); });
  renderCustom();
  bindSeg("blind-seg", (v) => S.blind = v === "on");
  $("btn-vibtest").onclick = () => {
    ensureAudio();
    let ok = false;
    try { ok = !!(navigator.vibrate && navigator.vibrate([200, 100, 200])); } catch (e) {}
    beep(600, 0.2);
    $("vib-result").textContent = ok ? t("vibOk") : t("vibNo");
  };
  document.addEventListener("touchstart", twoFingerAbort, { passive: true });
  bindSeg("cons-seg", (v) => S.conseq = v);
  bindSeg("lock-seg", (v) => { S.lock = v === "on"; $("lock-opts").classList.toggle("hidden", !S.lock); if (!S.lock) { S.lockCode = ""; $("lock-code").value = ""; } });
  $("lock-code").addEventListener("input", (e) => { S.lockCode = e.target.value.trim(); });
  $("sos").onclick = abort;
  // Handsfree-avbryt: håll markören/näsan över knappen i 1,5 s, eller tryck Esc
  $("sos").addEventListener("pointerenter", () => {
    $("sos").classList.add("dwell");
    clearTimeout(S.dwellId);
    S.dwellId = setTimeout(abort, 1500);
  });
  $("sos").addEventListener("pointerleave", () => {
    $("sos").classList.remove("dwell");
    clearTimeout(S.dwellId);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && $("guide").classList.contains("show")) { closeGuide(); return; }
    if (e.key === "Escape" && ["st-session", "st-puzzle"].includes(S.stage)) abort();
  });
  $("btn-restart").onclick = restart;
  $("btn-abort-restart").onclick = restart;

  document.querySelectorAll(".dpad button").forEach(b => b.addEventListener("click", () => pressKey(b.dataset.k)));
  document.addEventListener("keydown", (e) => {
    if (S.stage !== "st-puzzle") return;
    if (!SYMBOL[e.key]) return;
    e.preventDefault();
    pressKey(e.key);
  });

  applyI18n();
  renderStepper();
});
</script>
</body>
</html>
